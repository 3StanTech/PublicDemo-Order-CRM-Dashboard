# Quality gate: lint, unit tests, production build, Cloud Function bundle,
# public-safety, bundle budget, Firestore rules (emulator), and Playwright smoke.
# No repository secrets required.
name: quality

on:
  pull_request:
  push:
    branches:
      - main
  # The Hosting deploy workflows call this first and deploy only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm --prefix functions ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build functions
        run: npm run build:functions

      - name: Public-safety check
        run: npm run check:public-safe

      - name: Bundle budget
        run: npm run check:bundle

      - name: Firestore rules
        run: npm run test:rules

      - name: E2E smoke
        run: npm run test:e2e
        env:
          VITE_STORAGE: local

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
