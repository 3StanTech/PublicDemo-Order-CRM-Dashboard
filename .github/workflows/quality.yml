# Quality gate: lint, unit tests, production build, Cloud Function bundle,
# public-safety, bundle budget, Firestore rules (emulator), and Playwright smoke.
# No repository secrets required.
name: quality

on:
  pull_request:
  push:
    branches:
      - main
  # The Hosting deploy workflows call this first and deploy only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm --prefix functions ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build functions
        run: npm run build:functions

      - name: Public-safety check
        run: npm run check:public-safe

      - name: Bundle budget
        run: npm run check:bundle

      - name: Firestore rules
        run: npm run test:rules

      - name: E2E smoke
        run: npm run test:e2e
        env:
          VITE_STORAGE: local

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
